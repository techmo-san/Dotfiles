# Launch the coding session with the required tabs

# Launch the coding tab
new_tab Editor
cd ${HOME}/coding/${DIR}
launch --title Editor vim

# Launch another tab with vertical split
new_tab Debug
layout splits
cd ${HOME}/coding
launch bash
launch --location=vsplit bash

# Launch lazygit
new_tab LazyGit
cd ${HOME}/coding/${DIR}
launch lazygit

# Go to the editor tab
focus_tab 0
